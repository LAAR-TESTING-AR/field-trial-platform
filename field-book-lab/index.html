<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Book | Field Trial Platform</title>
  <link rel="stylesheet" href="field-book.css">
  <style>
    body.field-book-module-open .field-book-app {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 8px;
      box-sizing: border-box;
    }

    body.field-book-module-open .field-book-content {
      margin: 0;
      border: 0;
      box-shadow: none;
      background: transparent;
    }

    body.field-book-module-open #fieldBookContent > div {
      padding: 0 !important;
    }

    .field-book-module-card {
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .field-book-module-card:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(23,76,49,.13) !important;
    }

    @media (max-width: 760px) {
      .field-book-module-grid {
        grid-template-columns: 1fr !important;
      }

      body.field-book-module-open #fieldBookLayoutView {
        grid-template-columns: 1fr !important;
      }

      body.field-book-module-open #fieldBookLayoutView > aside {
        max-height: none !important;
      }
    }
    body.field-book-module-open { padding-bottom: 100px; }
</style>
</head>
<body>
  <header class="lab-header">
    <div class="lab-title">FIELD BOOK LAB</div>
    <div class="lab-status">Ambiente de desarrollo</div>
  </header>
  <main class="field-book-app">
    <section class="lab-warning">
      <strong>FIELD BOOK LAB</strong>
      <span>Ambiente de prueba. No utilizar para operación real.</span>
    </section>
    <section class="field-book-header">
      <div>
        <span class="section-label">FIELD TRIAL PLATFORM</span>
        <h1>Field Book</h1>
        <p>Planting execution &amp; trial layout</p>
      </div>
    </section>
    <section class="field-book-selector">
      <label for="fieldBookAoi">AOI</label>
      <select id="fieldBookAoi">
        <option value="">Seleccionar AOI</option>
        <option value="ANCY04NMETAT">ANCY04NMETAT</option>
      </select>
    </section>
    <section id="fieldBookContent" class="field-book-content">
      <div class="empty-state">
        <strong>Field Book Lab</strong>
        <span>Seleccioná una AOI para comenzar.</span>
      </div>
    </section>
  </main>
  <script src="data/layouts/ANCY04NMETAT-data.js"></script>
  
<script src="data/layouts/Hernando-layouts-data.js"></script>
  <script src="data/settings/field-book-settings-data.js"></script>
  <script src="field-book.js"></script>
</body>
</html>
