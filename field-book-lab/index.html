<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Book | Field Trial Platform</title>
  <link rel="stylesheet" href="field-book.css?v=20">
</head>
<body>
  <header class="lab-header">
    <div class="lab-title">FIELD BOOK</div>
  </header>

  <main class="field-book-app">
    <section class="fb-library-landing" id="fieldBookLanding">
      <div class="fb-closed-book">
        <div class="fb-closed-book-spine"></div>
        <div class="fb-closed-book-content">
          <span class="section-label">FIELD TRIAL PLATFORM</span>
          <h1>Field Book</h1>
          <p>Planting execution &amp; trial layout</p>
          <div class="fb-cover-selector">
            <label for="fieldBookAoi">Elegí la AOI para abrir el libro</label>
            <select id="fieldBookAoi">
              <option value="">Cargando AOI desde SharePoint...</option>
            </select>
          </div>
          <div class="fb-cover-hint">Seleccioná una AOI para abrir su Field Book</div>
        </div>
      </div>
    </section>

    <section id="fieldBookContent" class="field-book-content">
      <div class="empty-state fb-hidden-initial">
        <strong>Field Book</strong>
        <span>Seleccioná una AOI para abrir el libro.</span>
      </div>
    </section>
  </main>

  <script src="data/settings/field-book-settings-data.js"></script>
  <script src="field-book.js?v=11"></script>
  <script>
  (() => {
    const pages = [
      { key: "cover", label: "COVER" },
      { key: "overview", label: "OVERVIEW" },
      { key: "layout", label: "FIELD MAP" },
      { key: "checklist", label: "CHECKLIST" },
      { key: "issues", label: "ISSUES" },
      { key: "close", label: "CLOSE" }
    ];
    let currentPage = 0;
    let locked = false;

    function setVisible(el, visible, display = "block") {
      if (!el) return;
      el.hidden = !visible;
      el.style.display = visible ? display : "none";
    }

    function findModuleButton(key) {
      return document.querySelector(`.field-book-module-card[data-module="${key}"]`);
    }

    function makeClosePage(shell) {
      let closePage = shell.querySelector("#fieldBookBookClosePage");
      if (closePage) return closePage;
      closePage = document.createElement("section");
      closePage.id = "fieldBookBookClosePage";
      closePage.className = "fb-book-close-page";
      closePage.innerHTML = `
        <div class="fb-book-close-mark">✓</div>
        <span class="section-label">FIELD BOOK</span>
        <h2>Cerrar libro de campo</h2>
        <p>Revisá la última página y completá el Field Book cuando corresponda.</p>
        <button id="fieldBookReturnToAoi" type="button">VOLVER A AOI</button>`;
      shell.appendChild(closePage);
      closePage.querySelector("#fieldBookReturnToAoi").addEventListener("click", returnToAoiSelector);
      return closePage;
    }

    function arrangeCover(home) {
      if (!home) return;
      const grid=home.querySelector(".field-book-module-grid"); if(!grid)return;
      const active=[...home.querySelectorAll("div")].find(el => /ACTIVE FIELD BOOK/i.test(el.textContent||"") && !el.classList.contains("field-book-module-grid"));
      if(active){ active.classList.add("fb-active-field-book-card"); if(active.nextElementSibling!==grid) grid.parentElement.insertBefore(active,grid); }
    }

    function decorateCoverCards(home) {
      if (!home || home.dataset.visualCards === "1") return;
      home.dataset.visualCards = "1";
      const visuals = {
        overview: { src:"Overview.png", alt:"Overview" },
        layout: { src:"Field Map.png", alt:"Field Map" },
        checklist: { src:"Checklist.png", alt:"Checklist" },
        issues: { src:"Issues.png", alt:"Issues" }
      };
      home.querySelectorAll(".field-book-module-card").forEach(card => {
        const cfg = visuals[card.dataset.module];
        if (!cfg || card.querySelector(".fb-cover-card-art")) return;
        const art = document.createElement("div");
        art.className = "fb-cover-card-art";
        art.innerHTML = `<img src="${cfg.src}" alt="${cfg.alt}">`;
        card.insertBefore(art, card.firstChild);
        card.classList.add("fb-cover-visual-card");
      });
    }

    function isFieldBookStarted() { return !document.getElementById("fieldBookStartVisit"); }

    function returnToAoiSelector() {
      const selector = document.getElementById("fieldBookAoi");
      currentPage = 0;
      if (selector) { selector.value = ""; selector.dispatchEvent(new Event("change", { bubbles:true })); }
      document.body.classList.remove("field-book-book-open", "field-book-module-open");
      document.getElementById("fieldBookLanding")?.classList.remove("is-hidden");
      window.scrollTo({top:0,behavior:"smooth"});
    }

    function ensureBook() {
      const content = document.getElementById("fieldBookContent");
      const shell = content?.firstElementChild;
      const home = document.getElementById("fieldBookModuleHome");
      if (!shell || !home || shell.dataset.bookReady === "1") return;

      shell.dataset.bookReady = "1";
      document.getElementById("fieldBookLanding")?.classList.add("is-hidden");
      shell.classList.add("fb-book-shell");
      home.classList.add("fb-book-cover");
      decorateCoverCards(home);
      arrangeCover(home);
      document.body.classList.add("field-book-book-open");

      const chrome = document.createElement("div");
      chrome.className = "fb-book-chrome";
      chrome.innerHTML = `
        <button class="fb-page-curl fb-page-curl-left" type="button" aria-label="Página anterior">
          <span>‹</span><small>BACK</small>
        </button>
        <button class="fb-page-curl fb-page-curl-right" type="button" aria-label="Página siguiente">
          <span>›</span><small>NEXT</small>
        </button>
        <button class="fb-change-aoi" type="button" aria-label="Cambiar AOI" title="Cambiar AOI">↩ AOI</button>
        <div class="fb-book-top-title">
          <span id="fbBookTopTitle">FIELD BOOK</span>
          <strong id="fbBookTopAoi"></strong>
        </div>
        <div class="fb-book-page-meta">
          <span id="fbBookPageLabel">COVER</span>
          <b id="fbBookPageNumber">0 / 4</b>
        </div>`;
      shell.appendChild(chrome);
      makeClosePage(shell);

      chrome.querySelector(".fb-page-curl-left").addEventListener("click", () => goTo(currentPage - 1));
      chrome.querySelector(".fb-page-curl-right").addEventListener("click", () => goTo(currentPage + 1));
      chrome.querySelector(".fb-change-aoi").addEventListener("click", returnToAoiSelector);

      home.querySelectorAll(".field-book-module-card").forEach(card => {
        card.addEventListener("click", () => {
          const index = pages.findIndex(page => page.key === card.dataset.module);
          if (index >= 0) setTimeout(() => {
            const els = pageElements();
            setVisible(els.home, false);
            updateChrome(index);
          }, 0);
        });
      });

      // A re-render (for example after editing a Checklist card) keeps the current book page.
      const requestedPage = document.body.classList.contains("field-book-book-open") ? currentPage : 0;
      updateChrome(requestedPage);
    }

    function pageElements() {
      return {
        home: document.getElementById("fieldBookModuleHome"),
        toolbar: document.getElementById("fieldBookModuleToolbar"),
        overview: document.getElementById("fieldBookOverviewView"),
        layout: document.getElementById("fieldBookLayoutView"),
        checklist: document.getElementById("fieldBookChecklistView"),
        issues: document.getElementById("fieldBookIssuesView"),
        close: document.getElementById("fieldBookBookClosePage")
      };
    }

    function updateChrome(index) {
      currentPage = Math.max(0, Math.min(pages.length - 1, index));
      const shell = document.querySelector(".fb-book-shell");
      if (!shell) return;
      shell.dataset.page = pages[currentPage].key;
      shell.querySelector("#fbBookPageLabel").textContent = pages[currentPage].label;
      shell.querySelector("#fbBookPageNumber").textContent = currentPage === 0 ? "COVER" : currentPage === 5 ? "END" : `${currentPage} / 4`;
      const topTitle = shell.querySelector("#fbBookTopTitle");
      const topAoi = shell.querySelector("#fbBookTopAoi");
      if (topTitle) topTitle.textContent = pages[currentPage].label;
      if (topAoi) topAoi.textContent = document.getElementById("fieldBookAoi")?.value || "";
      const prevBtn=shell.querySelector(".fb-page-curl-left"), nextBtn=shell.querySelector(".fb-page-curl-right");
      prevBtn.disabled=currentPage===0;
      const started=isFieldBookStarted();
      nextBtn.disabled=currentPage===pages.length-1 || (currentPage===1 && !started);
      nextBtn.title=(currentPage===1 && !started)?"Iniciá Field Book para habilitar páginas 2–4":"Página siguiente";
      shell.classList.toggle("fb-book-not-started",currentPage===1 && !started);
    }

    function animateTurn(direction, callback) {
      const shell = document.querySelector(".fb-book-shell");
      if (!shell || locked) return;
      locked = true;
      shell.classList.remove("fb-turn-next", "fb-turn-back");
      shell.classList.add(direction > 0 ? "fb-turn-next" : "fb-turn-back");
      setTimeout(() => {
        callback();
        shell.classList.remove("fb-turn-next", "fb-turn-back");
        shell.classList.add("fb-page-arrive");
        setTimeout(() => { shell.classList.remove("fb-page-arrive"); locked = false; }, 260);
      }, 210);
    }

    function goTo(index) {
      const target = Math.max(0, Math.min(pages.length - 1, index));
      if (target === currentPage || locked) return;
      if (!isFieldBookStarted() && currentPage === 1 && target > 1) return;
      const direction = target > currentPage ? 1 : -1;
      animateTurn(direction, () => {
        const els = pageElements();
        const page = pages[target].key;

        setVisible(els.close, false);
        if (page === "cover") {
          document.getElementById("fieldBookBackHome")?.click();
          setVisible(els.home, true);
        } else if (page === "close") {
          setVisible(els.home, false);
          setVisible(els.toolbar, false);
          setVisible(els.overview, false);
          setVisible(els.layout, false);
          setVisible(els.checklist, false);
          setVisible(els.issues, false);
          setVisible(els.close, true, "flex");
        } else {
          // Interior pages show only the actual page content, never the green cover/home.
          setVisible(els.home, false);
          setVisible(els.close, false);
          const card = findModuleButton(page);
          const fallback = {
            overview: "fieldBookTabOverview",
            layout: "fieldBookTabLayout",
            checklist: "fieldBookTabChecklist",
            issues: "fieldBookTabIssues"
          }[page];
          if (card && !card.disabled) card.click();
          else document.getElementById(fallback)?.click();
        }
        updateChrome(target);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    const observer = new MutationObserver(() => ensureBook());
    observer.observe(document.getElementById("fieldBookContent"), { childList: true, subtree: true });
    document.addEventListener("keydown", event => {
      if (!document.body.classList.contains("field-book-book-open")) return;
      if (event.key === "ArrowRight") goTo(currentPage + 1);
      if (event.key === "ArrowLeft") goTo(currentPage - 1);
    });
    ensureBook();
  })();
  </script>
</body>
</html>
