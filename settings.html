<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Settings</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f6f5;
      margin:0;
      padding:40px;
    }

    h1{
      color:#0b6b3a;
    }

    .card{
      max-width:700px;
      background:white;
      padding:20px;
      border-radius:16px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
    }

    .setting-item{
  margin:15px 0;
  font-size:18px;
}

.setting-item input{
  transform:scale(1.4);
  margin-right:10px;
}
    
  </style>
</head>

<body>
<script>
  const SETTINGS_PASSWORD = "FTP2026";

  const enteredPassword = prompt("Enter the Platform Settings password:");

  if (enteredPassword !== SETTINGS_PASSWORD) {
    alert("Incorrect password. Access denied.");
    window.location.href = "index.html";
  }
</script>
<div class="card">

  <h1>⚙ Platform Settings</h1>
<button onclick="window.location.href='platform.html'"
style="
background:#0b6b3a;
color:white;
border:none;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
margin-bottom:20px;
">
← Back to Dashboard
</button>
  <p>
    Experimental laboratory for future platform features.
  </p>
<div class="setting-item">
  <input type="checkbox" id="trialVisits">
  <label for="trialVisits">
    Trial Visits (Master Switch)
  </label>
</div>
<div class="setting-item">
  <input type="checkbox" id="trialPhotos">
  <label for="trialPhotos">Trial Photos</label>
</div>

<div class="setting-item">
  <input type="checkbox" id="visitComments">
  <label for="visitComments">Visit Comments</label>
</div>

<div class="setting-item">
  <input type="checkbox" id="visitScore">
  <label for="visitScore">Visit Score</label>
</div>

<div class="setting-item">
  <input type="checkbox" id="cropStage">
  <label for="cropStage">Crop Stage</label>
</div>

<div class="setting-item">
  <input type="checkbox" id="timeline">
  <label for="timeline">Timeline</label>
</div>

<button id="saveSettings">
  Save Settings
</button>
<hr>

<h3>Current Configuration</h3>

<pre id="settingsStatus"></pre>

</div>
  
  
</div>

  <script>

const settings = [
  "trialVisits",
  "trialPhotos",
  "visitComments",
  "visitScore",
  "cropStage",
  "timeline"
];
function updateSettingsStatus() {

  const status =
    document.getElementById(
      "settingsStatus"
    );

  status.textContent =
    JSON.stringify(
      {
        trialVisits:
  localStorage.getItem("trialVisits"),
        trialPhotos:
          localStorage.getItem("trialPhotos"),
        visitComments:
          localStorage.getItem("visitComments"),
        visitScore:
          localStorage.getItem("visitScore"),
        cropStage:
          localStorage.getItem("cropStage"),
        timeline:
          localStorage.getItem("timeline")
      },
      null,
      2
    );

}
window.addEventListener("DOMContentLoaded", () => {

  settings.forEach(id => {

    const checkbox =
      document.getElementById(id);

    if (!checkbox) return;

    checkbox.checked =
      localStorage.getItem(id) === "true";

    checkbox.addEventListener(
      "change",
      () => {

        localStorage.setItem(
          id,
          checkbox.checked
        );
updateSettingsStatus();
      }
    );

  });
updateSettingsStatus();
});
const FLOW_UPDATE_URL = "TEST";
    alert("NUEVA VERSION CARGADA");


const saveButton =
  document.getElementById("saveSettings");

saveButton.addEventListener(
  "click",
  async () => {
console.log("BOTON SAVE EJECUTADO");
    try {

      const payload = {

        trialVisits:
          document.getElementById(
            "trialVisits"
          ).checked,

        trialPhotos:
          document.getElementById(
            "trialPhotos"
          ).checked,

        visitComments:
          document.getElementById(
            "visitComments"
          ).checked,

        visitScore:
          document.getElementById(
            "visitScore"
          ).checked,

        cropStage:
          document.getElementById(
            "cropStage"
          ).checked,

        timeline:
          document.getElementById(
            "timeline"
          ).checked

      };

      const response =
        await fetch(
          FLOW_UPDATE_URL,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify(payload)
          }
        );

      if (!response.ok) {

        throw new Error(
          "Unable to save settings."
        );

      }

      alert(
        "Platform Settings Saved"
      );

    } catch (error) {

      console.error(error);

      alert(
        "Error saving Platform Settings"
      );

    }

  }
);


</script>
  
</body>
</html>
