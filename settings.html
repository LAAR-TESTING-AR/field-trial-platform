<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Settings</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f6f5;
      margin:0;
      padding:40px;
    }

    h1{
      color:#0b6b3a;
    }

    .card{
      max-width:700px;
      background:white;
      padding:20px;
      border-radius:16px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
    }

    .setting-item{
  margin:15px 0;
  font-size:18px;
}

.setting-item input{
  transform:scale(1.4);
  margin-right:10px;
}
    
  </style>
</head>

<body>

<div class="card">

  <h1>⚙ Platform Settings</h1>

  <p>
    Experimental laboratory for future platform features.
  </p>

<div class="setting-item">
  <input type="checkbox" id="trialPhotos">
  <label for="trialPhotos">Trial Photos</label>
</div>

<div class="setting-item">
  <input type="checkbox" id="visitComments">
  <label for="visitComments">Visit Comments</label>
</div>

<div class="setting-item">
  <input type="checkbox" id="visitScore">
  <label for="visitScore">Visit Score</label>
</div>

<div class="setting-item">
  <input type="checkbox" id="cropStage">
  <label for="cropStage">Crop Stage</label>
</div>

<div class="setting-item">
  <input type="checkbox" id="timeline">
  <label for="timeline">Timeline</label>
</div>

</div>

  <script>

const settings = [
  "trialPhotos",
  "visitComments",
  "visitScore",
  "cropStage",
  "timeline"
];

window.addEventListener("DOMContentLoaded", () => {

  settings.forEach(id => {

    const checkbox =
      document.getElementById(id);

    if (!checkbox) return;

    checkbox.checked =
      localStorage.getItem(id) === "true";

    checkbox.addEventListener(
      "change",
      () => {

        localStorage.setItem(
          id,
          checkbox.checked
        );

      }
    );

  });

});

</script>
  
</body>
</html>
