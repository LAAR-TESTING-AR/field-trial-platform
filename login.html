<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Field Trial Platform</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Segoe UI',Arial,sans-serif;

      background:
      repeating-linear-gradient(
        -12deg,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 4px,
        transparent 4px,
        transparent 42px
      ),
      linear-gradient(
        135deg,
        #0b6b3a 0%,
        #157a43 55%,
        #22884c 100%
      );
    }

    .login-box{
      width:430px;
      background:#ffffff;
      border-radius:22px;
      padding:40px;
      text-align:center;
      box-shadow:0 18px 45px rgba(0,0,0,.25);
    }

    .logo{
      width:120px;
      height:auto;
      margin-bottom:10px;
    }

    h1{
      margin:0;
      color:#0b6b3a;
      font-size:28px;
      font-weight:700;
    }

    .campaign{
      color:#0b6b3a;
      font-weight:600;
      margin-top:8px;
      margin-bottom:8px;
    }

    .subtitle{
      color:#666;
      font-size:13px;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #d5d5d5;
      border-radius:10px;
      font-size:15px;
      margin-bottom:15px;
    }

    input:focus{
      outline:none;
      border-color:#0b6b3a;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#0b6b3a;
      color:white;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:.2s;
    }

    button:hover{
      background:#095a31;
      transform:translateY(-1px);
    }

    #mensaje{
      margin-top:15px;
      color:#b00020;
      min-height:20px;
      font-size:14px;
    }

    .footer{
      margin-top:25px;
      color:#888;
      font-size:11px;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <img src="icon-512.png"
         alt="Field Trial Platform"
         class="logo">

    <h1>Field Trial Platform

    <div class="subtitle">
      Research Argentina · Trial Management Platform
    </div>

    <input
      type="email"
      id="email"
      placeholder="Ingrese su email corporativo o externo">

    <button id="loginButton" type="button">
      Ingresar
    </button>

    <div id="mensaje"></div>

    <div class="footer">
      Secure Access · Powered by Research Argentina
    </div>

  </div>

  <script>

    const FLOW_URL = "https://default3e20ecb29cb04df1ad7b914e31dcdd.a4.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d7f7e0110a4a4390a6b4e8f31847304f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=slLPo92zmR1rIHI1Mvt86-aMxMR2X8QDETPAqj2iJcs";

const loggedIn =
  localStorage.getItem(
    "loggedIn"
  );

const userRole =
  localStorage.getItem(
    "userRole"
  );

if (
  loggedIn === "true" &&
  userRole
) {

  if (
    userRole.toLowerCase() ===
    "viewer"
  ) {

    window.location.href =
      "viewer.html";

  } else {

    window.location.href =
      "platform.html";

  }

}
    
    async function login(){

      const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const mensaje =
        document.getElementById("mensaje");

      if(!email){
        mensaje.textContent =
          "Ingrese un email.";
        return;
      }

      try{

        const response = await fetch(
          FLOW_URL,
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json"
            },
            body:JSON.stringify({
              email:email
            })
          }
        );

        const data =
          await response.json();

        let role = data.role;

        if (
          role &&
          typeof role === "object"
        ){
          role =
            role.Value ||
            role.value ||
            "";
        }

        role =
          String(role || "")
          .trim();

        if(!role){
          throw new Error(
            "Rol no recibido"
          );
        }

        localStorage.setItem(
          "loggedIn",
          "true"
        );

        localStorage.setItem(
          "userEmail",
          email
        );

        localStorage.setItem(
          "userRole",
          role
        );

        
        if(
          role.toLowerCase() ===
          "viewer"
        ){
          window.location.href =
            "viewer.html";
        }else{
          window.location.href =
            "platform.html";
        }

      }catch(error){

        console.error(error);

        mensaje.textContent =
          "No fue posible validar el usuario.";

      }

    }

    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        login
      );

  </script>

</body>
</html>
