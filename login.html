<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Trial Platform - Login</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f4f6f4;}
.login-box{width:320px;padding:30px;background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.15)}
h1{margin-top:0;color:#0b6b3a;text-align:center}
input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:15px}
button{border:0;border-radius:6px;background:#0b6b3a;color:#fff;cursor:pointer}
#mensaje{margin-top:15px;text-align:center;color:#b00020}
</style>
</head>
<body>
<div class="login-box">
<h1>Field Trial Platform</h1>
<input type="email" id="email" placeholder="Ingrese su email">
<button id="loginButton" type="button">Ingresar</button>
<div id="mensaje"></div>
</div>
<script>
const FLOW_URL = "https://default3e20ecb29cb04df1ad7b914e31dcdd.a4.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d7f7e0110a4a4390a6b4e8f31847304f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=slLPo92zmR1rIHI1Mvt86-aMxMR2X8QDETPAqj2iJcs";

async function login(){
 const email=document.getElementById('email').value.trim().toLowerCase();
 const mensaje=document.getElementById('mensaje');
 if(!email){mensaje.textContent='Ingrese un email';return;}
 try{
   const response=await fetch(FLOW_URL,{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({email:email})
   });

   const data=await response.json();
   console.log('Respuesta flujo:',data);

let role = data.role;

if (typeof role === "string") {
  try {
    const roleParsed = JSON.parse(role);
    role = roleParsed.Value || roleParsed.value || role;
  } catch (_) {
    role = role;
  }
} else if (role && typeof role === "object") {
  role = role.Value || role.value;
}

role = String(role || "").trim();

if (!role) {
  throw new Error("El flujo no devolvió un rol válido.");
}

   localStorage.setItem('loggedIn','true');
   localStorage.setItem('userEmail',email);
   localStorage.setItem('userRole',role);

   if(role.trim().toLowerCase()==='viewer'){
      window.location.href='viewer.html';
   } else {
      window.location.href='platform.html';
   }
 }catch(error){
   console.error(error);
   mensaje.textContent='Error de conexión';
 }
}

document.getElementById('loginButton').addEventListener('click',login);
</script>
</body>
</html>
