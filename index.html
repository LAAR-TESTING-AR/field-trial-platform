  <script>
    checkAppVersion();
    let recargaPorActualizacion = false;

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register(
            "./service-worker.js",
            { updateViaCache: "none" }
          );

          window.fieldTrialServiceWorkerRegistration = registration;

          console.log(
            "Service Worker registrado:",
            registration.scope
          );

          if (registration.waiting) {
            registration.waiting.postMessage({
              type: "SKIP_WAITING"
            });
          }

          registration.addEventListener("updatefound", () => {
            const nuevoWorker = registration.installing;

            if (!nuevoWorker) return;

            nuevoWorker.addEventListener("statechange", () => {
              if (
                nuevoWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                nuevoWorker.postMessage({
                  type: "SKIP_WAITING"
                });
              }
            });
          });

          await registration.update();
        } catch (error) {
          console.error(
            "Error al registrar o actualizar Service Worker:",
            error
          );
        }
      });

      navigator.serviceWorker.addEventListener(
        "controllerchange",
        () => {
          if (recargaPorActualizacion) return;

          recargaPorActualizacion = true;
          console.log(
            "Nueva version activa. Recargando la aplicacion."
          );
          window.location.reload();
        }
      );
    }
  </script>

<script>
(function(){
  "use strict";
  function norm(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s-]/g," ").replace(/\s+/g," ").trim();}
  const STOP=new Set(["mostrar","mostrame","muestrame","buscar","busca","quiero","ver","localidad","localidades","sitio","sitios","ensayo","ensayos","de","del","la","las","el","los","por","para","con","en","fts","especialista","responsable","que","tengan","tiene","estado"]);
  function aplicar(frase){
    const input=document.getElementById("busqueda"); if(!input)return;
    const t=norm(frase);
    if(/\b(limpiar|borrar|resetear|restablecer)\b/.test(t)&&/\bfiltros?\b/.test(t)){const b=document.getElementById("limpiarFiltros");if(b)b.click();return;}
    input.value=[...new Set(t.split(" ").filter(Boolean).filter(x=>!STOP.has(x)))].join(" ");
    input.dispatchEvent(new Event("input",{bubbles:true})); input.dispatchEvent(new Event("change",{bubbles:true}));
  }
  window.masterListVoiceStart=function(ev){
    if(ev){ev.preventDefault();ev.stopPropagation();}
    const boton=document.getElementById("btnVoiceSearchMasterList");
    const input=document.getElementById("busqueda");
    if(boton){boton.textContent="…";boton.style.background="#eef6f1";}
    const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!R){
      if(boton){boton.textContent="🎙️";boton.style.background="#fff";}
      if(input)input.focus();
      alert("El navegador de este dispositivo no habilita reconocimiento de voz directo en la aplicación. Podés dictar usando el micrófono del teclado del teléfono dentro del buscador.");
      return false;
    }
    try{
      const r=new R(); r.lang="es-AR"; r.continuous=false; r.interimResults=false; r.maxAlternatives=1;
      r.onstart=function(){if(boton){boton.textContent="🔴";boton.style.background="#eef6f1";}};
      r.onresult=function(e){aplicar(e.results&&e.results[0]&&e.results[0][0]?e.results[0][0].transcript:"");};
      r.onerror=function(e){console.warn("Voice search",e.error);alert("Búsqueda por voz: "+e.error);};
      r.onend=function(){if(boton){boton.textContent="🎙️";boton.style.background="#fff";}};
      r.start();
    }catch(e){
      console.error(e); if(boton){boton.textContent="🎙️";boton.style.background="#fff";} alert("No se pudo iniciar la búsqueda por voz.");
    }
    return false;
  };
})();
</script>
